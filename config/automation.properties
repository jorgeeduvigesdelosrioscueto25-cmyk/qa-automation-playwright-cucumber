# Configuracion compartida por ejecuciones locales y GitHub Actions.
# Prioridad: argumentos CLI > variables de entorno/pipeline > este archivo > defaults.
# Formato UTF-8: CLAVE=valor. Sin comillas; comentarios en lineas separadas.
BASE_URL=https://www.saucedemo.com/

# chromium | firefox | webkit | all
BROWSER=chromium
# parallel | sequential (concurrencia entre navegadores)
EXECUTION_MODE=parallel
# true: sin ventana; false: muestra el navegador (CI utiliza pantalla virtual).
HEADLESS=true
# 0: escenarios secuenciales; 1 o mas: workers por navegador.
CUCUMBER_PARALLEL=0

# true: muestra logs detallados; false: solo resumen y progreso.
# El log tecnico se guarda en reports en ambos casos.
EXECUTION_LOGS=false
SCREENSHOT_EACH_STEP=true
TRACE_ON_FAILURE=true

# Limites en milisegundos.
ACTION_TIMEOUT=15000
ASSERTION_TIMEOUT=10000
SCENARIO_TIMEOUT=120000
REPORT_TIMEZONE=America/Lima
DATA_FILE=resources/data/xc-DataTest.xlsx

# Filtros opcionales. Ejemplos: TAGS=@happyPath ; TAP=TAP-001,TAP-007
# TAGS y TAP se combinan; vacio selecciona todos los casos de los Features.
TAGS=
TAP=
# true valida Gherkin sin abrir navegadores; no representa casos PASSED.
DRY_RUN=false
